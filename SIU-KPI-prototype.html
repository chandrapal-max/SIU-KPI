<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIU KPI Accountability Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5FB; --surface:#FFFFFF; --surface2:#F8FAFD; --tint:#EEF3FC; --line:#E2E8F3; --line2:#CFD9EA;
  --ink:#0B1B33; --ink2:#2E4263; --muted:#62718A;
  --blue:#1D4ED8; --blue2:#2563EB; --sky:#3B82F6;
  --hero:linear-gradient(120deg,#0A2350 0%,#123C8C 48%,#1D5BE0 100%);
  --side:linear-gradient(180deg,#0A2350 0%,#0D2D66 100%);
  --btn:linear-gradient(180deg,#2B6BF3 0%,#1D4ED8 100%);
  --g:#16A34A; --a:#D97706; --r:#DC2626; --p:#94A3B8;
  --c1:#1D4ED8; --c2:#0EA5E9; --c3:#6366F1; --c4:#14B8A6; --c5:#8B5CF6; --c6:#F59E0B; --c7:#64748B;
  --shadow:0 1px 2px rgba(15,35,80,.05),0 6px 20px rgba(15,35,80,.06);
  --shadow-lg:0 24px 60px rgba(10,35,80,.22);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#070E1B; --surface:#0F1A2E; --surface2:#0C1626; --tint:#16243F; --line:#21324F; --line2:#2E4469;
    --ink:#F3F6FC; --ink2:#D3DDEE; --muted:#A3B3CE;
    --blue:#6AA8FF; --blue2:#3B82F6; --sky:#93C5FD;
    --hero:linear-gradient(120deg,#0A1A3A 0%,#16357A 50%,#2257D6 100%);
    --side:linear-gradient(180deg,#060D1A 0%,#0A1730 100%);
    --btn:linear-gradient(180deg,#3B82F6 0%,#2563EB 100%);
    --g:#34D399; --a:#FBBF24; --r:#F87171; --p:#A0AEC4;
    --c1:#6AA8FF; --c2:#38BDF8; --c3:#A5B4FC; --c4:#2DD4BF; --c5:#C4B5FD; --c6:#FBBF24; --c7:#A0AEC4;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#070E1B; --surface:#0F1A2E; --surface2:#0C1626; --tint:#16243F; --line:#21324F; --line2:#2E4469;
  --ink:#F3F6FC; --ink2:#D3DDEE; --muted:#A3B3CE;
  --blue:#6AA8FF; --blue2:#3B82F6; --sky:#93C5FD;
  --hero:linear-gradient(120deg,#0A1A3A 0%,#16357A 50%,#2257D6 100%);
  --side:linear-gradient(180deg,#060D1A 0%,#0A1730 100%);
  --btn:linear-gradient(180deg,#3B82F6 0%,#2563EB 100%);
  --g:#34D399; --a:#FBBF24; --r:#F87171; --p:#A0AEC4;
  --c1:#6AA8FF; --c2:#38BDF8; --c3:#A5B4FC; --c4:#2DD4BF; --c5:#C4B5FD; --c6:#FBBF24; --c7:#A0AEC4;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:6px}
svg text{font-family:inherit}

/* Motion */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes arcIn{from{stroke-dasharray:0 var(--c)}}
@keyframes gaugeIn{from{stroke-dasharray:0 100}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes dash{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
.noanim *{animation:none!important}
.wrap{animation:fadeUp .4s cubic-bezier(.2,.8,.2,1) both}
.arc{animation:arcIn 1.1s cubic-bezier(.2,.8,.2,1) both}
.gv{animation:gaugeIn 1.3s cubic-bezier(.2,.8,.2,1) both}
.grow{transform-origin:left center;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
.rise{transform-box:fill-box;transform-origin:bottom;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.slice{transform-box:view-box;animation:pop .7s cubic-bezier(.2,.8,.2,1) both;transition:transform .2s}
.slice:hover{transform:scale(1.04)}
.line{stroke-dasharray:1;stroke-dashoffset:1;animation:dash 1.4s cubic-bezier(.2,.8,.2,1) forwards}
.fadein{animation:fade 1s .3s both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.line{stroke-dashoffset:0}}

#shell{height:100%;container-type:inline-size;container-name:shell;position:relative;overflow:hidden;background:var(--bg)}
body.phone{background:radial-gradient(circle at 30% 20%,#DCE7FA,#B9CCEE);overflow:auto}
:root[data-theme="dark"] body.phone{background:radial-gradient(circle at 30% 20%,#13254A,#050B16)}
body.phone #shell{width:392px;height:min(830px,calc(100% - 32px));margin:16px auto;border:11px solid #0A1A3A;border-radius:38px;box-shadow:var(--shadow-lg)}
#app{display:grid;grid-template-columns:252px 1fr;height:100%}

/* Sidebar */
.side{background:var(--side);color:#fff;display:flex;flex-direction:column;min-height:0;z-index:30;border-right:1px solid rgba(255,255,255,.06)}
.brand{display:flex;gap:11px;align-items:center;padding:20px 18px 16px}
.mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#3B82F6,#60A5FA);display:grid;place-items:center;flex:none;box-shadow:0 6px 16px rgba(59,130,246,.45)}
.brand b{display:block;font-size:14.5px;line-height:1.2;letter-spacing:-.01em}
.brand span{display:block;font-size:12px;color:#A9BCDD}
.nav{flex:1;overflow:auto;padding:4px 12px 12px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.nav h6{margin:18px 10px 6px;font-size:11.5px;font-weight:600;color:#8FA6CC;letter-spacing:.02em}
.nav button{position:relative;display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:#DCE6F7;padding:9px 11px;border-radius:10px;cursor:pointer;text-align:left;font-size:13.5px;font-weight:500;transition:background .15s,color .15s}
.nav button svg{width:18px;height:18px;flex:none;opacity:.8}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:linear-gradient(90deg,rgba(96,165,250,.28),rgba(96,165,250,.08));color:#fff;font-weight:650}
.nav button.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#60A5FA}
.nav button.on svg{opacity:1;color:#93C5FD}
.nav .count{margin-left:auto;background:rgba(255,255,255,.14);border-radius:999px;padding:0 8px;font-size:11.5px;font-weight:700;color:#fff}
.nav .count.hot{background:#EF4444}
.side-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:10px;align-items:center}
.side-foot .who{flex:1;min-width:0}
.side-foot .who b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .who span{display:block;font-size:11.5px;color:#A9BCDD;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#DBEAFE,#BFDBFE);color:#0A2350;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.iconbtn{border:0;background:none;color:inherit;cursor:pointer;padding:7px;border-radius:9px;display:grid;place-items:center;transition:background .15s}
.iconbtn svg{width:18px;height:18px}
.iconbtn:hover{background:rgba(127,160,210,.16)}

/* Topbar */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 24px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);flex:none;position:relative;z-index:20}
.top .menu{display:none}
.crumbs{min-width:0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs b{color:var(--ink);font-weight:650}
.search{position:relative;flex:1;max-width:420px;margin-left:auto}
.search input{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 12px 8px 36px;font-size:13px;transition:border-color .15s,box-shadow .15s}
.search input:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px color-mix(in srgb,var(--sky) 22%,transparent)}
.search>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:600 11px/1 inherit;color:var(--muted);border:1px solid var(--line2);border-radius:5px;padding:3px 5px;background:var(--surface)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden;display:none;max-height:360px;overflow-y:auto}
.results.on{display:block}
.results button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:10px 14px;text-align:left;cursor:pointer;border-bottom:1px solid var(--line)}
.results button:hover,.results button.sel{background:var(--tint)}
.results small{color:var(--muted);margin-left:auto;white-space:nowrap}
.tool{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink2);transition:border-color .15s}
.tool:hover{border-color:var(--sky)}
.tool svg{width:16px;height:16px}
.tool.on{background:var(--tint);border-color:var(--blue);color:var(--blue)}
.yearpick{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600;color:var(--ink2)}
.bell{position:relative}
.bell .dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:#EF4444;box-shadow:0 0 0 2px var(--surface)}
.content{flex:1;overflow:auto;padding:24px 28px 64px;scroll-behavior:smooth}
.wrap{max-width:1240px;margin:0 auto}

/* Type */
h1{font-size:26px;line-height:1.2;margin:0;font-weight:800;letter-spacing:-.02em}
h2{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em}
h3{font-size:14.5px;margin:0;font-weight:700}
.sub{color:var(--muted);margin:5px 0 0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.ph{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.back{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;margin-bottom:8px;cursor:pointer}
.back svg{width:14px;height:14px}

/* Hero band */
.hero{position:relative;overflow:hidden;background:var(--hero);color:#fff;border-radius:20px;padding:26px 28px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;box-shadow:0 18px 40px rgba(18,60,140,.25)}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px);background-size:18px 18px;mask-image:linear-gradient(90deg,transparent,#000 70%);pointer-events:none}
.hero::after{content:"";position:absolute;right:-120px;top:-160px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(147,197,253,.35),transparent 65%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero h1{color:#fff;font-size:28px}
.hero .sub{color:#C4D5F2}
.hero .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hchip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;color:#fff;backdrop-filter:blur(6px)}
.hchip i{width:8px;height:8px;border-radius:50%}
.hero .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
.hero .btn:hover{background:rgba(255,255,255,.2)}
.overlap{margin-top:-34px;padding:0 18px;position:relative;z-index:2}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);padding:8px 14px;cursor:pointer;font-weight:650;font-size:13.5px;color:var(--ink);transition:transform .12s,box-shadow .15s,border-color .15s,background .15s;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn:hover{border-color:var(--sky);box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--btn);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(37,99,235,.35)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.warn{color:var(--r);border-color:color-mix(in srgb,var(--r) 45%,transparent)}
.btn.ghost{border-color:transparent;background:none;color:var(--blue);box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none;filter:none}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.card-h p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.span2{grid-column:span 2}
.mt{margin-top:18px}
.stack>*+*{margin-top:18px}

/* Stat cards */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0;position:relative;overflow:hidden}
.stat .top-row{display:flex;justify-content:space-between;align-items:center}
.stat .lbl{color:var(--muted);font-size:12.5px;font-weight:600}
.stat .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--k,var(--blue)) 14%,transparent);color:var(--k,var(--blue))}
.stat .ico svg{width:18px;height:18px}
.stat .val{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat .val small{font-size:14px;color:var(--muted);font-weight:600}
.stat .foot{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:12px;border-radius:999px;padding:1px 8px}
.delta.up{color:var(--g);background:color-mix(in srgb,var(--g) 14%,transparent)}
.delta.down{color:var(--r);background:color-mix(in srgb,var(--r) 14%,transparent)}
.spark{position:absolute;right:14px;bottom:12px;opacity:.9}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap;color:var(--k);background:color-mix(in srgb,var(--k) 14%,transparent);border:1px solid color-mix(in srgb,var(--k) 22%,transparent)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.noDot::before{display:none}
.chip svg{width:12px;height:12px}
.k-g{--k:var(--g)} .k-a{--k:var(--a)} .k-r{--k:var(--r)} .k-p{--k:var(--p)} .k-b{--k:var(--blue)}
.tag{display:inline-block;border:1px solid var(--line2);border-radius:7px;padding:2px 8px;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}

/* Tables */
.tw{overflow-x:auto;margin:0 -6px;padding:0 6px}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:680px}
th{text-align:left;font-size:12px;font-weight:700;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2);position:sticky;top:0}
th:first-child{border-top-left-radius:10px} th:last-child{border-top-right-radius:10px}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer;transition:background .12s}
tbody tr.click:hover td{background:var(--tint)}
td.num,th.num{text-align:right}
.kid{font-weight:700;color:var(--blue);white-space:nowrap}
.mini{display:inline-block;width:64px;height:6px;border-radius:999px;background:var(--tint);overflow:hidden;vertical-align:middle;margin-right:8px}
.mini i{display:block;height:100%;border-radius:999px}

/* Charts */
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut-wrap svg{flex:none}
.legend{display:flex;flex-direction:column;gap:9px;flex:1;min-width:150px}
.legend div{display:grid;grid-template-columns:12px 1fr auto auto;gap:9px;align-items:center;font-size:13px}
.legend i{width:12px;height:12px;border-radius:4px}
.legend b{font-weight:700}
.legend span.pc{color:var(--muted);font-size:12px;min-width:38px;text-align:right}
.hbars{display:flex;flex-direction:column;gap:14px}
.hb{display:grid;grid-template-columns:minmax(120px,1.1fr) 2fr 70px;gap:14px;align-items:center;cursor:pointer}
.hb .nm{font-size:13px;font-weight:600;line-height:1.3}
.hb .nm small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.hb .tr{position:relative;height:12px;border-radius:999px;background:var(--tint)}
.hb .tr i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--k) 60%,transparent),var(--k))}
.hb .tr u{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink2);border-radius:2px;opacity:.55}
.hb .vl{text-align:right;font-weight:800;font-size:13.5px}
.hb:hover .tr{box-shadow:0 0 0 3px color-mix(in srgb,var(--k) 18%,transparent)}
.ribbon{display:flex;gap:4px;height:40px}
.seg{position:relative;background:var(--tint);border-radius:8px;overflow:hidden;cursor:pointer;min-width:20px;transition:transform .15s}
.seg:hover{transform:translateY(-2px)}
.seg .fill{position:absolute;left:0;bottom:0;right:0;background:linear-gradient(180deg,color-mix(in srgb,var(--k) 70%,#fff),var(--k));transform-origin:bottom;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.seg span{position:absolute;left:5px;top:3px;font-size:10.5px;font-weight:800;color:var(--ink);z-index:1;mix-blend-mode:normal}
.ribbon-l{display:flex;gap:4px;margin-top:5px}
.ribbon-l div{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden}
.heat{display:flex;flex-direction:column;gap:8px}
.heat .row{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center}
.heat .row>b{font-size:12px;color:var(--muted)}
.tiles{display:flex;flex-wrap:wrap;gap:5px}
.tile{width:42px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:10.5px;font-weight:800;cursor:pointer;color:var(--ink);transition:transform .15s,box-shadow .15s;animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.tile:hover{transform:scale(1.12);box-shadow:var(--shadow);z-index:2}
.tile.pend{background:repeating-linear-gradient(45deg,var(--tint),var(--tint) 4px,var(--surface) 4px,var(--surface) 8px);border:1px dashed var(--line2);color:var(--muted)}
.scale{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.scale span{display:inline-flex;gap:6px;align-items:center}
.scale i{width:12px;height:12px;border-radius:4px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:650;font-size:13px}
.field .hint{font-size:12px;color:var(--muted)}
.input,select.input,textarea.input{border:1px solid var(--line2);border-radius:10px;padding:9px 12px;background:var(--surface);width:100%;transition:border-color .15s,box-shadow .15s}

.err{color:var(--r);font-size:12.5px;font-weight:650;min-height:1px}
.drop{border:1.5px dashed color-mix(in srgb,var(--blue) 55%,transparent);border-radius:12px;padding:20px;text-align:center;background:color-mix(in srgb,var(--blue) 6%,transparent);cursor:pointer;color:var(--blue);font-weight:650;transition:background .15s}

.drop svg{vertical-align:-4px;margin-right:6px}
.file{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-top:8px;background:var(--surface2);animation:fadeUp .3s both}
.file .fi{width:32px;height:32px;border-radius:8px;background:color-mix(in srgb,var(--r) 14%,transparent);color:var(--r);display:grid;place-items:center;font-size:10px;font-weight:800;flex:none}
.file .meta{flex:1;min-width:0}
.file .meta b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .meta span{font-size:11.5px;color:var(--muted)}
.calc{background:var(--hero);color:#fff;border-radius:18px;padding:20px 22px;position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(18,60,140,.25)}
.calc::after{content:"";position:absolute;right:-80px;top:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(147,197,253,.3),transparent 70%)}

.calc .row:last-child{border:0}
.calc .row span{color:#C4D5F2}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:650;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.seg-ctl{display:inline-flex;background:var(--tint);border-radius:10px;padding:3px;gap:2px}
.seg-ctl button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:650;color:var(--muted)}
.seg-ctl button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12.5px;font-weight:650;color:var(--muted);transition:all .15s}
.pill:hover{border-color:var(--sky);color:var(--ink)}
.pill.on{background:var(--btn);border-color:transparent;color:#fff}
.banner{display:flex;gap:11px;align-items:flex-start;border-radius:12px;padding:12px 14px;margin-bottom:18px;color:var(--ink);border:1px solid color-mix(in srgb,var(--k) 30%,transparent);background:color-mix(in srgb,var(--k) 9%,var(--surface))}
.banner svg{width:18px;height:18px;flex:none;color:var(--k);margin-top:2px}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 18px 26px}
.tl li::before{content:"";position:absolute;left:4px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--k,var(--blue))}
.tl li::after{content:"";position:absolute;left:9px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl b{display:block;font-size:13px}
.tl span{font-size:12px;color:var(--muted)}
.check{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.check:last-child{border:0}
.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--blue2)}
.ok{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:12px;font-weight:800;color:var(--k);background:color-mix(in srgb,var(--k) 16%,transparent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.weightin{width:80px;text-align:right;font-weight:700}
.prog{height:8px;border-radius:999px;background:var(--tint);overflow:hidden}
.prog i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--sky),var(--blue))}

/* Kanban */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;overflow-x:auto}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:200px}
.col h3{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:2px 4px 10px}
.kc{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--k);border-radius:10px;padding:11px 12px;margin-bottom:9px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
.kc:hover{transform:translateY(-2px)}
.kc b{display:block;font-size:13px;margin-bottom:3px}
.kc .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}

/* Flow guide */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
.step:hover{transform:translateY(-3px);border-color:var(--sky)}
.step .n{width:34px;height:34px;border-radius:11px;background:var(--btn);color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 6px 14px rgba(37,99,235,.35)}
.step p{margin:0;color:var(--muted);font-size:13px;flex:1}
.step .who{font-size:12px;font-weight:700;color:var(--blue)}

.login{display:grid;grid-template-columns:1.1fr 1fr;height:100%;overflow:auto;background:var(--surface)}

.login-l::after{content:"";position:absolute;left:40%;top:30%;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(96,165,250,.35),transparent 60%)}
.login-l>*{position:relative;z-index:1}
.login-l h1{font-size:44px;line-height:1.06;color:#fff;max-width:14ch;letter-spacing:-.03em}
.login-l p{color:#C4D5F2;max-width:46ch;font-size:15.5px}
.glass{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:16px 18px;backdrop-filter:blur(12px);display:flex;gap:18px;align-items:center;max-width:470px;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:fadeUp .8s .2s both}
.glass .gl{flex:1;display:flex;flex-direction:column;gap:9px}
.glass .gl div{display:flex;justify-content:space-between;font-size:12.5px;color:#DCE7F8}
.login-r{padding:44px 56px;display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:620px;width:100%;margin:0 auto}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rolecard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;background:var(--surface);cursor:pointer;display:flex;gap:11px;align-items:center;transition:all .15s}

.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* Overlays */
.scrim{position:absolute;inset:0;background:rgba(5,15,35,.5);backdrop-filter:blur(3px);display:none;z-index:50;align-items:center;justify-content:center;padding:20px}
.scrim.on{display:flex;animation:fade .2s both}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;max-width:520px;width:100%;padding:24px;box-shadow:var(--shadow-lg);animation:fadeUp .25s both}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.drawer-scrim{position:absolute;inset:0;background:rgba(5,15,35,.5);z-index:25;display:none}
.pop{position:absolute;top:58px;right:18px;width:360px;max-width:calc(100% - 36px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);z-index:40;display:none;overflow:hidden}
.pop.on{display:block;animation:fadeUp .2s both}
.pop .ph2{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.pop .item{display:flex;gap:11px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.pop .item:hover{background:var(--tint)}
.pop .item:last-child{border:0}
.pop .item b{display:block;font-size:13px}
.pop .item span{font-size:12px;color:var(--muted)}
.toast{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#0A1A3A;color:#fff;padding:12px 18px 12px 14px;border-radius:12px;font-weight:650;opacity:0;transition:.3s cubic-bezier(.2,.8,.2,1);z-index:60;pointer-events:none;max-width:90%;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,.1)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast i{width:22px;height:22px;border-radius:50%;background:#22C55E;display:grid;place-items:center;font-style:normal;font-size:12px}
#tip{position:fixed;z-index:100;pointer-events:none;background:#0A1A3A;color:#fff;font-size:12px;font-weight:600;padding:7px 10px;border-radius:8px;opacity:0;transition:opacity .12s;max-width:260px;box-shadow:0 8px 20px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.1)}
#tip.on{opacity:1}
.ro{display:inline-flex;gap:6px;align-items:center;background:var(--tint);color:var(--blue);font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.empty{text-align:center;padding:36px 20px}
.empty .ei{width:52px;height:52px;border-radius:16px;margin:0 auto 12px;display:grid;place-items:center;background:var(--tint);color:var(--blue)}

/* Responsive via container */
@container shell (max-width: 860px){
  #app{grid-template-columns:1fr}
  .side{position:absolute;inset:0 auto 0 0;width:276px;transform:translateX(-100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
  .side.open{transform:none}
  .side.open ~ .drawer-scrim{display:block}
  .top .menu{display:grid}
  .top{padding:10px 14px}
  .content{padding:16px 14px 70px}
  .g2,.g3,.g21,.g12{grid-template-columns:minmax(0,1fr)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .span2{grid-column:auto}
  .flow{grid-template-columns:minmax(0,1fr)}
  .login{grid-template-columns:1fr}
  .login-l,.login-r{padding:28px 22px}
  .login-l h1{font-size:32px}
  .hero{grid-template-columns:1fr;padding:22px 20px}
  .hero h1{font-size:23px}
  .overlap{margin-top:-24px;padding:0 10px}
  h1{font-size:22px}
  .hide-n{display:none!important}
  .roles{grid-template-columns:1fr}
  .search kbd{display:none}
  .stat .val{font-size:23px}
  .hb{grid-template-columns:minmax(90px,1fr) 1.4fr 56px;gap:10px}
  .crumbs{display:none}
  .board{grid-template-columns:repeat(4,240px)}
  .entry-grid>.stack{order:-1}
}
@container shell (max-width: 1140px) and (min-width: 861px){
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3.collapse{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ================= Scoring engine ================= */
function calc(k){
  if(k.actual==null||isNaN(k.actual)) return {ach:null,cap:null,band:null,earned:null,rag:'p'};
  let a;
  if(k.dir==='B') a = k.actual>=1?100:0;
  else if(k.dir==='H') a = k.actual/k.target*100;
  else a = k.actual>0 ? k.target/k.actual*100 : 100;
  const cap = Math.min(a,100);
  const b = S.bands.find(x=>cap>=x[0]);
  const band = b?b[1]/100:0;
  return {ach:a,cap,band,earned:k.alloc*band,rag:ragOf(cap)};
}
const ragOf = v => v==null?'p':v>=S.rag.g?'g':v>=S.rag.a?'a':'r';
function paramScores(){
  return PARAMS.map(p=>{
    const ks = KPIS.filter(k=>k.p===p.id);
    const alloc = ks.reduce((s,k)=>s+k.alloc,0);
    const earned = ks.reduce((s,k)=>s+(calc(k).earned||0),0);
    const pend = ks.filter(k=>k.actual==null).length;
    const pct = earned/alloc*100;
    const w = +S.weights[p.id]||0;
    return {...p,w,pct,score:pct*w/100,pend,count:ks.length,rag:ragOf(pct)};
  });
}

function donut(segs,{size=180,th=22,center='',sub='',legend=true}={}){
  const r=(size-th)/2, c=2*Math.PI*r, cx=size/2, tot=segs.reduce((s,x)=>s+x.v,0)||1; let off=0;
  const live=segs.filter(s=>s.v>0);
  const arcs=live.map((s,i)=>{const len=s.v/tot*c, gap=live.length>1?3:0;
    const el=`<circle class="arc" cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${th}" stroke-linecap="butt" stroke-dasharray="${Math.max(.5,len-gap)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cx})" style="--c:${c};animation-delay:${i*.08}s" data-tip="${esc(s.l)}: ${s.v} (${Math.round(s.v/tot*100)}%)"/>`;off+=len;return el}).join('');
  const svg=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(center+' '+sub)}">
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--tint)" stroke-width="${th}"/>${arcs}
    <text x="${cx}" y="${cx+2}" text-anchor="middle" font-size="${size*.17}" font-weight="800" fill="var(--ink)" class="${/^[\d.]+$/.test(center)?'cu':''}" data-v="${center}" data-d="${String(center).includes('.')?1:0}">${center}</text>
    <text x="${cx}" y="${cx+size*.12}" text-anchor="middle" font-size="${Math.max(11,size*.065)}" font-weight="600" fill="var(--muted)">${sub}</text></svg>`;
  if(!legend) return svg;
  return `<div class="donut-wrap">${svg}<div class="legend">${segs.map(s=>`<div><i style="background:${s.c}"></i><span>${esc(s.l)}</span><b>${s.v%1?f1(s.v):s.v}</b><span class="pc">${Math.round(s.v/tot*100)}%</span></div>`).join('')}</div></div>`;
}
function pie(segs,{size=220,labels=true}={}){
  const cx=size/2,r=size/2-6,tot=segs.reduce((s,x)=>s+x.v,0)||1;let a0=-Math.PI/2;
  const parts=segs.filter(s=>s.v>0).map((s,i)=>{const a1=a0+s.v/tot*Math.PI*2, mid=(a0+a1)/2;
    const x0=cx+r*Math.cos(a0),y0=cx+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cx+r*Math.sin(a1),lg=(a1-a0)>Math.PI?1:0;
    const d=(a1-a0)>=Math.PI*2-1e-6?`M ${cx-r} ${cx} a ${r} ${r} 0 1 0 ${2*r} 0 a ${r} ${r} 0 1 0 ${-2*r} 0`:`M ${cx} ${cx} L ${x0} ${y0} A ${r} ${r} 0 ${lg} 1 ${x1} ${y1} Z`;
    const pc=s.v/tot*100, lx=cx+r*.64*Math.cos(mid), ly=cx+r*.64*Math.sin(mid);
    a0=a1;

  return `<div class="donut-wrap"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Pie chart">${parts}</svg>

    ${pts.map((p,i)=>{const v=s.vals.filter(v=>v!=null)[i];return `<circle cx="${p[0]}" cy="${p[1]}" r="5.5" fill="var(--surface)" stroke="${s.c}" stroke-width="3" class="fadein" data-tip="${s.n}, ${years[s.vals.indexOf(v)]}: ${f1(v)}"/>`}).join('')}`}).join('');
  const xl=years.map((t,i)=>`<text x="${x(i)}" y="${h-8}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--muted)">${t}</text>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${h}" role="img" aria-label="Trend chart">${grid}${thr}${body}${xl}</svg></div>
  <div class="scale">${series.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('')}</div>`;
}
function columns(items,{h=240}={}){ // stacked: earned vs available weight
  const W=600,L=34,R=10,T=20,B=34, max=Math.max(...items.map(i=>i.w))*1.12, bw=(W-L-R)/items.length*.56, y=v=>T+(max-v)/max*(h-T-B);
  const grid=[0,10,20,30,40].filter(v=>v<=max).map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join('');
  const bars=items.map((it,i)=>{const cx=L+(i+.5)*(W-L-R)/items.length, x0=cx-bw/2;
    return `<g data-tip="${esc(it.id+' '+it.name)}: ${f1(it.score)} of ${it.w} points" style="cursor:pointer" data-go="inst" data-pf="${it.id}">
      <rect x="${x0}" y="${y(it.w)}" width="${bw}" height="${y(0)-y(it.w)}" rx="7" fill="var(--tint)" stroke="var(--line2)" stroke-dasharray="3 3"/>
      <rect class="rise" x="${x0}" y="${y(it.score)}" width="${bw}" height="${y(0)-y(it.score)}" rx="7" fill="${RAGC[it.rag]}" style="animation-delay:${i*.07}s"/>
      <text x="${cx}" y="${y(it.w)-6}" text-anchor="middle" font-size="12" font-weight="800" fill="var(--ink)">${f1(it.score)}</text>
      <text x="${cx}" y="${h-12}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">${it.id}</text></g>`}).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${h}" role="img" aria-label="Points earned against available points">${grid}${bars}</svg></div>
  <div class="scale"><span><i style="background:var(--g)"></i>Earned, Green</span><span><i style="background:var(--a)"></i>Earned, Amber</span><span><i style="background:var(--r)"></i>Earned, Red</span><span><i style="background:var(--tint);border:1px dashed var(--line2)"></i>Points available</span></div>`;
}
function radar(axes,{size=300,color='var(--blue)'}={}){
  const cx=size/2, R=size*.34, n=axes.length, pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+R*v/100*Math.cos(a),cx+R*v/100*Math.sin(a)]};
  const ring=v=>`<polygon points="${axes.map((_,i)=>pt(i,v).join(',')).join(' ')}" fill="none" stroke="var(--line)" />`;
  const id=uid();
  const poly=axes.map((a,i)=>pt(i,Math.min(100,a.v)).join(',')).join(' ');
  const thr=axes.map((_,i)=>pt(i,S.rag.g).join(',')).join(' ');
  return `<div class="chart" style="max-width:${size+40}px;margin:0 auto"><svg viewBox="-20 0 ${size+40} ${size}" role="img" aria-label="Radar chart">
   <defs><radialGradient id="${id}"><stop offset="0" style="stop-color:${color};stop-opacity:.15"/><stop offset="1" style="stop-color:${color};stop-opacity:.4"/></radialGradient></defs>
   ${[25,50,75,100].map(ring).join('')}
   ${axes.map((_,i)=>{const p=pt(i,100);return `<line x1="${cx}" y1="${cx}" x2="${p[0]}" y2="${p[1]}" stroke="var(--line)"/>`}).join('')}
   <polygon points="${thr}" fill="none" stroke="var(--g)" stroke-width="1.5" stroke-dasharray="5 4"/>
   <polygon class="slice" style="transform-origin:${cx}px ${cx}px" points="${poly}" fill="url(#${id})" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
   ${axes.map((a,i)=>{const p=pt(i,Math.min(100,a.v));return `<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="${RAGC[ragOf(a.v)]}" stroke="var(--surface)" stroke-width="2" data-tip="${esc(a.t||a.l)}: ${f1(a.v)}%"/>`}).join('')}
   ${axes.map((a,i)=>{const p=pt(i,122);const an=Math.abs(p[0]-cx)<8?'middle':p[0]>cx?'start':'end';return `<text x="${p[0]}" y="${p[1]+4}" text-anchor="${an}" font-size="12" font-weight="700" fill="var(--ink2)">${esc(a.l)}</text>`}).join('')}
  </svg></div><div class="scale" style="justify-content:center"><span><i style="background:${color}"></i>Achievement</span><span><i style="background:none;border:2px dashed var(--g)"></i>Green threshold ${S.rag.g}%</span></div>`;
}
function heatmap(){
  return `<div class="heat">${PARAMS.map(p=>`<div class="row"><b>${p.id}</b><div class="tiles">${KPIS.filter(k=>k.p===p.id).map((k,i)=>{const c=calc(k);
    if(c.cap==null) return `<div class="tile pend" data-go="kpi" data-kpi="${k.id}" data-tip="${k.id} ${esc(k.name)}: awaiting data" style="animation-delay:${i*.02}s">${k.id.slice(3)}</div>`;
    const mix=Math.round(35+c.cap*.6);
    return `<div class="tile" data-go="kpi" data-kpi="${k.id}" data-tip="${k.id} ${esc(k.name)}: ${f1(c.cap)}% achieved" style="background:color-mix(in srgb,${RAGC[c.rag]} ${mix}%,var(--surface));animation-delay:${i*.02}s;color:${mix>70?'#fff':'var(--ink)'}">${k.id.slice(3)}</div>`}).join('')}</div></div>`).join('')}</div>
    <div class="scale"><span><i style="background:var(--g)"></i>Green ${S.rag.g}%+</span><span><i style="background:var(--a)"></i>Amber ${S.rag.a} to ${S.rag.g-1}%</span><span><i style="background:var(--r)"></i>Red below ${S.rag.a}%</span><span><i style="background:var(--tint);border:1px dashed var(--line2)"></i>Pending</span></div>`;
}
function spark(vals,color='var(--blue)',w=90,h=30){
  const mn=Math.min(...vals),mx=Math.max(...vals),x=i=>i*(w-4)/(vals.length-1)+2,y=v=>h-3-(v-mn)/((mx-mn)||1)*(h-6);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline class="line" pathLength="1" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${vals.map((v,i)=>x(i)+','+y(v)).join(' ')}"/></svg>`;
}
function vcols(items,{h=200,max,marker,W=420}={}){ // simple columns
  const L=30,R=10,T=18,B=30; max=max||Math.max(...items.map(i=>i.v))*1.15; const bw=(W-L-R)/items.length*.5, y=v=>T+(max-v)/max*(h-T-B);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${h}">${[0,.25,.5,.75,1].map(f=>`<line x1="${L}" x2="${W-R}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="var(--line)"/>`).join('')}
  ${marker!=null?`<line x1="${L}" x2="${W-R}" y1="${y(marker.v)}" y2="${y(marker.v)}" stroke="var(--g)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-R}" y="${y(marker.v)-6}" text-anchor="end" font-size="11" font-weight="700" fill="var(--g)">${marker.l}</text>`:''}
  ${items.map((it,i)=>{const cx=L+(i+.5)*(W-L-R)/items.length;return `<g data-tip="${esc(it.l)}: ${it.t||it.v}"><rect class="rise" x="${cx-bw/2}" y="${y(it.v)}" width="${bw}" height="${Math.max(0,y(0)-y(it.v))}" rx="7" fill="${it.c}" style="animation-delay:${i*.08}s"/>
  <text x="${cx}" y="${y(it.v)-7}" text-anchor="middle" font-size="12" font-weight="800" fill="var(--ink)">${it.t||it.v}</text><text x="${cx}" y="${h-10}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--muted)">${esc(it.l)}</text></g>`}).join('')}</svg></div>`;
}

const kpiHead = `<thead><tr><th>ID</th><th>Performance indicator</th><th class="num">Target</th><th class="num">Actual</th><th>Achievement</th><th class="num">Score</th><th>RAG</th><th>Status</th></tr></thead>`;
const ragCounts = (list=KPIS) => {const n={g:0,a:0,r:0,p:0};list.forEach(k=>n[calc(k).rag]++);return n};
const ragDonut = (list=KPIS,size=170) => {const n=ragCounts(list);return donut([{l:'Green',v:n.g,c:'var(--g)'},{l:'Amber',v:n.a,c:'var(--a)'},{l:'Red',v:n.r,c:'var(--r)'},{l:'Pending',v:n.p,c:'var(--p)'}],{size,center:String(list.length),sub:'KPIs'})};
const statusDonut = (list=KPIS,size=170) => {const c=s=>list.filter(k=>k.status===s).length;return donut([{l:'Approved',v:c('approved'),c:'var(--g)'},{l:'Submitted',v:c('submitted'),c:'var(--c1)'},{l:'Returned',v:c('returned'),c:'var(--a)'},{l:'Draft',v:c('draft'),c:'var(--p)'},{l:'Overdue',v:c('overdue'),c:'var(--r)'}],{size,center:String(Math.round((list.length-c('draft')-c('overdue'))/list.length*100)),sub:'% submitted'})};

function liveCalc(){
  const k=K(S.entry), box=document.getElementById('calc'); if(!box) return null;
  const n=document.getElementById('num'), d=document.getElementById('den'), a=document.getElementById('act'), err=document.getElementById('calcErr');
  let actual=null; err.textContent='';
  if(n){const nv=parseFloat(n.value.replace(/,/g,'')), dv=parseFloat(d.value.replace(/,/g,''));
    if(d.value!=='' && !(dv>0)) err.textContent='Incomplete: the denominator must be above zero. A zero denominator is never scored as 0% or 100%.';
    else if(!isNaN(nv)&&dv>0){ if(nv>dv) err.textContent='Numerator is higher than denominator. Please check both figures.'; actual=nv/dv*100; }}
  else if(a && a.value!=='') actual=parseFloat(a.value);
  const c = calc({...k,actual});
  box.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1"><b>Live calculation</b>${actual==null?'<span class="hchip">Waiting for figures</span>':`<span class="hchip"><i style="background:${{g:'#34D399',a:'#FBBF24',r:'#F87171'}[c.rag]}"></i>${RAGN[c.rag]}</span>`}</div>
  <div style="display:flex;justify-content:center;position:relative;z-index:1;margin:6px 0">${gauge(actual==null?0:c.cap,{size:220,dark:true,sub:'% of target',empty:actual==null})}</div>
  <div class="row"><span>Actual</span><b>${actual==null?'–':fv(k,Math.round(actual*10)/10)}</b></div>
  <div class="row"><span>Target</span><b>${tgt(k)}</b></div>
  <div class="row"><span>Band</span><b>${c.band==null?'–':c.band*100+'%'}</b></div>
  <div class="row"><span>Score</span><b>${c.earned==null?'–':f1(c.earned)+' of '+k.alloc}</b></div>
  ${actual!=null&&c.rag!=='g'?`<div class="small" style="margin-top:10px;color:#FDE68A;position:relative;z-index:1">A corrective action will be raised for ${RAGN[c.rag]} results.</div>`:''}`;
  if(!box.dataset.once){box.dataset.once=1;animateCounts(box);}else box.classList.add('noanim');
  return actual;
}

const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function animateCounts(root=document){
  root.querySelectorAll('.cu').forEach(el=>{const v=parseFloat(el.dataset.v),d=+(el.dataset.d||0);if(isNaN(v))return;
    if(reduced()){el.textContent=v.toFixed(d);return}const t0=performance.now();
    const step=t=>{const p=Math.min(1,(t-t0)/1000),e=1-Math.pow(1-p,3);el.textContent=(v*e).toFixed(d);if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step);});
}

function searchResults(q){
  q=q.trim().toLowerCase(); const box=document.getElementById('results'); if(!q){box.classList.remove('on');return;}
  const scr=Object.entries(SCREENS).filter(([k,v])=>!['kpi','reviewItem','actionForm'].includes(k)&&v[0].toLowerCase().includes(q)).slice(0,4).map(([k,v])=>`<button data-go="${k}" ${k==='entry'?'data-entry="P1.01"':''}>${ic(v[1])}<span>${v[0]}</span><small>Screen</small></button>`);
  const ks=KPIS.filter(k=>(k.id+' '+k.name+' '+k.owner).toLowerCase().includes(q)).slice(0,6).map(k=>`<button data-go="kpi" data-kpi="${k.id}">${chip(calc(k).rag)}<span><b>${k.id}</b> ${esc(k.name)}</span><small>${esc(k.owner)}</small></button>`);
  box.innerHTML=[...scr,...ks].join('')||`<div style="padding:14px" class="muted small">Nothing found for "${esc(q)}". Try a KPI ID such as P1.15.</div>`;box.classList.add('on');
}

/* ================= Events ================= */
document.addEventListener('click',e=>{
  if(e.target.closest('a'))e.preventDefault();
  const el=e.target.closest('[data-go],[data-as],[data-bell],[data-open-side],[data-close-side],[data-phone],[data-theme],[data-close],[data-modal],[data-do],[data-addfile],[data-submit],[data-verify],[data-report],[data-tab],[data-toast],[data-pf],[data-rf],[data-caview],[data-af]');
  if(!e.target.closest('.search'))document.getElementById('results')?.classList.remove('on');
  if(!el){ if(!e.target.closest('#pop'))document.getElementById('pop')?.classList.remove('on'); if(e.target.id==='scrim')closeModal(); return; }
  const d=el.dataset;
  if(d.bell!==undefined){document.getElementById('pop').classList.toggle('on');return;}
  document.getElementById('pop')?.classList.remove('on');
  if(d.openSide!==undefined){document.getElementById('side').classList.add('open');return;}
  if(d.closeSide!==undefined){document.getElementById('side').classList.remove('open');return;}
  if(d.phone!==undefined){S.phone=!S.phone;render();return;}
  if(d.theme!==undefined){const dark=!isDark();document.documentElement.dataset.theme=dark?'dark':'light';try{localStorage.setItem('siu-theme',dark?'dark':'light')}catch(_){}render();return;}
  if(d.close!==undefined){closeModal();return;}
  if(d.modal){openModal(d.modal);return;}
  if(d.do){
    if(d.do==='return'){const k=K(S.review);k.status='returned';k.returnReason=document.getElementById('rr').value;closeModal();S.screen='review';render();toast(`${k.id} returned to ${k.owner}`);return;}
    if(d.do==='approve'){S.scorecardApproved=true;closeModal();render();toast('Scorecard approved and Provost notified');return;}
    if(d.do==='lock'){S.yearLocked=true;closeModal();render();toast('2025/26 locked and archived');return;}
    if(d.do==='toast'){closeModal();toast(d.msg);return;}
  }
  if(d.addfile!==undefined){const k=K(S.entry);const f={n:`${k.id}_register_extract_${S.newFiles.length+1}.pdf`,s:'286 KB',h:hash(k.id+S.newFiles.length)};S.newFiles.push(f);
    document.getElementById('files').insertAdjacentHTML('beforeend',`<div class="file"><div class="fi">PDF</div><div class="meta"><b>${f.n}</b><span>${f.s} · SHA 256 ${f.h}…</span></div><span class="chip k-g">Hashed</span></div>`);document.getElementById('subErr').textContent='';toast('Evidence uploaded and hashed');return;}
  if(d.submit!==undefined){const k=K(S.entry);const a=liveCalc();const err=document.getElementById('subErr');
    if(a==null){err.textContent='Enter the annual figures before submitting.';return;}
    if(k.files.length+S.newFiles.length===0){err.textContent='Add at least one evidence file before submitting.';return;}
    k.actual=Math.round(a*10)/10;const n=document.getElementById('num');if(n){k.num=n.value;k.den=document.getElementById('den').value;}
    k.files=[...k.files,...S.newFiles];S.newFiles=[];k.status='submitted';S.review=k.id;S.screen='tasks';render();toast(`${k.id} submitted to Dr Arvind Rao for review`);return;}
  if(d.verify!==undefined){const k=K(S.review);k.status='approved';S.screen='review';render();toast(`${k.id} verified and sent to Director`);return;}
  if(d.report){S.report=d.report;render();return;}
  if(d.tab){S.adminTab=d.tab;render();return;}
  if(d.caview){S.caView=d.caview;render();return;}
  if(d.af){S.auditF=d.af;render();return;}
  if(d.toast && !d.go){toast(d.toast);return;}
  if(d.pf){S.pf=d.pf;if(!d.go){render();document.getElementById('kpiTable')?.scrollIntoView({block:'start'});return;}}
  if(d.rf){S.rf=d.rf;render();document.getElementById('kpiTable')?.scrollIntoView({block:'start'});return;}
  if(d.as){S.role=d.as;}
  if(d.go){
    if(d.kpi)S.kpi=d.kpi; if(d.entry){S.entry=d.entry;S.newFiles=[];} if(d.review)S.review=d.review; if(d.inst)S.inst=d.inst; if(d.ca)S.actionFor=d.ca;
    if(d.go!==S.screen&&!d.pf){S.pf='all';S.rf='all';S.q='';}
    if(d.go==='inst'&&S.role&&!['provost','board'].includes(S.role))S.inst='SCHC';
    if(d.go==='login'){S.role=null;}
    const prev=S.screen; S.screen=d.go; render();
    const c=document.getElementById('content'); if(c){ if(d.pf&&d.go==='inst'&&prev==='inst') document.getElementById('kpiTable')?.scrollIntoView({block:'start'}); else c.scrollTo({top:0}); }
    if(d.toast)toast(d.toast);
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='gsearch'){searchResults(t.value);return;}
  if(['num','den','act'].includes(t.id)) liveCalc();
  if(t.id==='rr') document.getElementById('rrBtn').disabled=t.value.trim().length<8;
  if(t.dataset.chk!==undefined){const all=[...document.querySelectorAll('[data-chk]')];const n=all.filter(c=>c.checked).length;document.getElementById('chkProg').textContent=`${n} of ${all.length}`;document.getElementById('verifyBtn').disabled=n!==all.length;}
  if(t.dataset.w){S.weights[t.dataset.w]=t.value;const tot=Object.values(S.weights).reduce((s,v)=>s+(+v||0),0);const el=document.getElementById('wtot');el.textContent=tot;el.style.color=tot===100?'var(--g)':'var(--r)';
    document.getElementById('wscore').textContent=f1(schcScore());document.getElementById('wSend').disabled=tot!==100;document.getElementById('wpie').innerHTML=pie(PARAMS.map(p=>({l:p.id+' '+p.short,v:+S.weights[p.id]||0,c:p.c})),{size:210});}
  if(t.dataset.rag){S.rag[t.dataset.rag]=+t.value;document.getElementById(t.dataset.rag+'v').textContent=t.value;document.getElementById('ragPrev').innerHTML=ragDonut(KPIS,150);animateCounts(document.getElementById('ragPrev'));}
  if(t.dataset.q!==undefined){S.q=t.value;const ks=KPIS.filter(k=>(S.pf==='all'||k.p===S.pf)&&(S.rf==='all'||calc(k).rag===S.rf)&&(!S.q||(k.id+k.name+k.owner).toLowerCase().includes(S.q.toLowerCase())));document.getElementById('kpiBody').innerHTML=ks.map(kpiRow).join('')||`<tr><td colspan="8" class="muted">Nothing matches "${esc(S.q)}".</td></tr>`;}
  if(t.dataset.mq!==undefined){S.q=t.value;document.getElementById('masterBody').innerHTML=masterRows();}
  if(t.dataset.uq!==undefined){S.q=t.value;document.getElementById('userBody').innerHTML=userRows();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();document.getElementById('results')?.classList.remove('on');document.getElementById('side')?.classList.remove('open');}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){const g=document.getElementById('gsearch');if(g){e.preventDefault();g.focus();}}
  if(e.key==='Enter'&&e.target.id==='gsearch'){document.querySelector('#results button')?.click();}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-addfile]')){e.preventDefault();e.target.click();}
});
const tip=document.getElementById('tip');
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(!t){tip.classList.remove('on');return}tip.textContent=t.dataset.tip;tip.classList.add('on');});
document.addEventListener('mousemove',e=>{if(!tip.classList.contains('on'))return;const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8),y=e.clientY+16+tip.offsetHeight>innerHeight?e.clientY-tip.offsetHeight-10:e.clientY+16;tip.style.left=x+'px';tip.style.top=y+'px';});
try{const t=localStorage.getItem('siu-theme');if(t)document.documentElement.dataset.theme=t;}catch(_){}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(!document.documentElement.dataset.theme)render();});
render();
</script>
